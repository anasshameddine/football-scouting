scouting:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'scout') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'scout_dev_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'scouting') }}"
      schema: public
      threads: 4
